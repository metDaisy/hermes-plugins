manifest_version: 2
api_version: 1
name: hermes-langchain
label: Hermes LangChain
version: 0.33.0
description: Runs profile-independent KWC fresh agents through explicit prompt, Skill, MCP, and toolset contracts.
author: metDaisy
license: MIT
kind: standalone
provides_tools:
  - hermes_langchain_run_workflow
  - hermes_langchain_begin_authoring
  - kwc_advance_triage
  - kwc_recover_frozen_triage
  - kwc_create_triage
  - kwc_create_impl_graph
  - kwc_create_review
  - kwc_create_summary
  - hermes_langchain_route
  - hermes_langchain_probe_guard
  - hermes_langchain_controller
  - hermes_langchain_materialize
  - hermes_langchain_activate
  - hermes_langchain_project_graph
  - hermes_langchain_materialize_graph
  - hermes_langchain_dispatch
  - hermes_langchain_invoke_agent
  - hermes_langchain_complete
pip_dependencies:
  - langchain>=1.0,<2.0
  - langchain-core>=1.0,<2.0
  - langgraph>=1.0,<2.0
  - langgraph-checkpoint-sqlite>=3.0,<4.0
  - langsmith>=0.3.0
tags:
  - kanban
  - workflow
  - orchestration
  - langchain
  - langgraph
