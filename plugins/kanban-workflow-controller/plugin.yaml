manifest_version: 2
api_version: 1
name: kanban-workflow-controller
label: Kanban Workflow Controller
version: 0.6.0
description: Routes schema-tag-filtered Kanban workflow events and KWC-owned comment conversations to Profile sessions.
author: metDaisy
license: MIT
kind: standalone
provides_hooks:
  - pre_llm_call
  - kanban_task_completed
  - kanban_task_blocked
  - on_kanban_worker_exited
  - on_kanban_worker_stale_claim
  - on_kanban_dispatch_tick
provides_tools:
  - kwc_comment
  - kwc_reply
tags:
  - kanban
  - workflow
  - orchestration
  - events
config_schema:
  coordinator_profile:
    type: string
    default: project-manager
    description: Profile that owns the persistent workflow coordinator session.
  decision_comment_author:
    type: string
    default: dashboard
    description: Exact Kanban comment author treated as the human response on blocked Decision cards.
  comment_profiles:
    type: string
    default: project-manager,coder,reviewer
    description: Comma-separated Profiles whose latest top-level session can receive KWC comment wakeups.
